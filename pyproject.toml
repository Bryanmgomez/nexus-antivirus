[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-antivirus"
version = "1.0.0"
description = "NEXUS ANTIVIRUS - proteccion de endpoints para Windows 10/11"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "NEXUS Security" }]
dependencies = [
    "PySide6>=6.6",
    "watchdog>=4.0",
    "psutil>=5.9",
    "pefile>=2023.2.7",
    "cryptography>=42.0",
    "yara-python>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
nexus-antivirus = "nexus.cli:main"

[project.gui-scripts]
nexus-antivirus-gui = "nexus.app:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
